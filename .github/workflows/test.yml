name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # The suite must pass with NO protoAgent host on the path. If `import graph`
      # ever starts working here, a host-only import has leaked to module top and
      # the "host-free" claim is silently false.
      - name: assert host-free
        run: python -c "
          import importlib.util, sys;
          sys.exit('protoAgent host is importable — the suite is no longer host-free')
          if importlib.util.find_spec('graph') else print('host-free ok')"
      - run: pytest -q
