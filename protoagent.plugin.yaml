id: prototrader-finance
name: protoTrader Finance
version: 0.4.0
description: >-
  The full-bundle finance plugin — every protoAgent contribution type in one
  installable repo. 13 market/quant **tools** (market data, vectorized backtest,
  factor IC, behavioral journal, gated paper broker), the 3-subagent research
  **desk** (market-analyst, quant, risk-manager), the quant-desk /
  investment-committee **workflows**, finance **skills**, a Quant Desk dashboard
  **console view** (ADR 0026), and **config / secrets / settings** (ADR 0019).
  Research-primary; the paper broker is OFF until a mandate exists and every order
  is HITL-gated + kill-switchable — distribution never relaxes that.

# Author default: OFF. Operators opt in (plugins.enabled) after reviewing — this
# plugin adds a file-writing paper broker (gated) and reaches market-data hosts.
enabled: false

# Deps are declared, NOT auto-installed (ADR 0027 D4) — `plugin install-deps
# prototrader-finance`, or `pip install -r requirements-finance.txt` in the fork.
# Dep tiers and interpreter scope, both expressed as `requires_pip` MAPPING entries
# (#1953 / #2246) — they are derived from this one list, not separate top-level keys.
#
#   optional: true  — the plugin degrades gracefully without it, so the frozen-app
#                     gate (ADR 0058 D2) warns instead of refusing. yfinance/ccxt
#                     only fetch LIVE prices; every view still renders off the
#                     bundled snapshot in `seed/`.
#   scope: host     — imported IN THIS PROCESS, not in the managed runtime that
#                     serves execute_code. They have separate site-packages, so the
#                     default (`runtime`) would pass the frozen install gate and then
#                     die with ModuleNotFoundError at every tool call.
#
# pandas/numpy are HARD: without them the data routes answer with an install
# command instead of data.
requires_pip:
  - { pkg: "pandas>=2", scope: host }
  - { pkg: "numpy>=1.26", scope: host }
  - { pkg: "yfinance>=0.2.40", optional: true, scope: host }
  - { pkg: "ccxt>=4.3", optional: true, scope: host }

# Event contract (ADR 0039) — auto-namespaced `prototrader-finance.*`. These are
# the plugin's PUBLIC api: another plugin subscribes by topic and never imports
# this one. The console lights the rail dot on them for free.
emits:
  - backtest_completed        # {symbol, strategy, period, sharpe, source}
  - factor_study_completed    # {period, universe_size, best_factor, best_ic}
  - order_filled              # {symbol, side, qty, price, notional}
  - mandate_armed             # {enabled, mode}
  - trading_halted            # {watch} — kill-switch engaged
  - drawdown_breach           # {watch} — the drawdown tripwire fired
  - data_refreshed            # {reason, symbols}
# Own-bus subscriptions (reactive housekeeping): a fill or a newly-armed mandate
# invalidates the dashboard's memoized gate, which a tool call would otherwise
# leave stale until the TTL expired.
subscribes:
  - prototrader-finance.order_filled
  - prototrader-finance.mandate_armed

# The console renders a "Test connection" button (ADR 0029) — POST
# /api/config/test-prototrader_finance reports WHICH data tier is reachable.
test: true

repository: https://github.com/protoLabsAI/prototrader-finance
homepage: https://github.com/protoLabsAI/prototrader-finance#readme
guide_url: "https://github.com/protoLabsAI/prototrader-finance#install"   # Settings "Setup guide" link (ADR 0059)
# Watches + watch hooks (ADR 0067, host PR #1507) are the highest floor here;
# sdk.plugin_store and the metric timeseries came later but this plugin degrades
# gracefully without them, so 0.78.0 is the honest hard gate.
min_protoagent_version: "0.78.0"

# Declarative (surfaced for review, not enforced): reaches market-data hosts;
# the paper broker writes its ledger/mandate under the config dir.
capabilities:
  network: ["query1.finance.yahoo.com", "query2.finance.yahoo.com", "*"]
  filesystem: scoped

# Config + secrets + Settings (ADR 0019) — claims a top-level `prototrader_finance`
# section; renders a Settings → Integrations group.
config_section: prototrader_finance
config:
  default_benchmark: "SPY"
  broker_mandate_path: ""
secrets: [market_data_api_key]
settings:
  - { key: default_benchmark, label: "Default benchmark", type: string, description: "Buy-and-hold benchmark for the dashboard + backtests (e.g. SPY, QQQ)." }
  - { key: market_data_api_key, label: "Market-data API key (optional)", type: secret, description: "Optional premium data-provider key; blank uses the keyless yfinance/ccxt path." }
  - { key: broker_mandate_path, label: "Broker mandate path", type: string, description: "Paper-broker mandate file. Blank uses broker_mandate.yaml inside the plugin's own store — the Ledger tab shows the exact path. The broker stays OFF until this file exists and sets enabled: true." }

# Console view (ADR 0026) — a left-rail icon opening the Quant Desk dashboard
# (iframe of a page this plugin serves at /plugins/prototrader-finance/dashboard).
# ONE rail icon with tabs (Overview / Backtest / Factors / Ledger), not four —
# the rail is shared space and every surface is another thing to maintain.
views:
  - { id: dashboard, label: "Quant Desk", icon: LineChart, path: /plugins/prototrader-finance/dashboard }
